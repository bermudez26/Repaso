name: Push Action GitHub
on: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    step:
      - name: Inicializacion Repositorio
        uses: actions/checkout@v4
          
      - name: Inicializacion Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Directorio de Salida
        run: mkdir -p src
      
      - name: Comipilar Java
        run: javac -d src $(find scr -name '*.java')

      - name: Crear JAR
        run: jar cfe src/Prueba.jar Main -C src .
          
      - name: Ejecutar JAR
        run: java -jar src/Prueba.jar
          
      - name: Subir Artefacto
        uses: actions/upload-artifact@v4
        with: 
          name: Prueba
          path: src/Prueba.jar
          
          
        
    
			
