name: Push Action GitHub

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Inicializacion Repositorio
        uses: actions/checkout@v4

      - name: Inicializacion Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Directorio de Salida
        run: mkdir -p out/classes


          
          
        
    
			
