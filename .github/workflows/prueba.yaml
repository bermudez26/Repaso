name: Prueba GitAction
on: 
  push: 
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
      
    steps:
    - name: Inicializar Repositorio
      uses: actions/checkout@v4

    - name: Inicializar Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Crear Carpeta
      run: mkdir -p out

    - name: Compilar java
      run: javac -d out $(find src -name "*.java")

    - name: Crear jar
      run: jar cfe out/Main.java Main -C out .

    - name: Ejecutar jar
      run: java jar out/Main.java
      
      
